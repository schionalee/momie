<title>La Momie et les Sarcophages</title>

<style>
/* Layout : une feuille de dessin plein écran, le score au crayon en haut, le jeu au milieu. */
:root{
  --paper:#FBF6EC; --ink:#4A4744; --sand:#F1DDB6; --mummy:#C9985F; --marker:#E8A66B;
  --cactus:#7FB069; --eye:#D9D926; --mouth:#A63A48; --sun:#F6C445; --soft:#8A8378;
  --display:"Patrick Hand","Comic Sans MS","Segoe Print",cursive;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#1F2233; --ink:#E6E1D6; --sand:#3A3550; --mummy:#D2A56E; --marker:#E39A5C;
  --cactus:#6FA45C; --eye:#E6E64A; --mouth:#D0596A; --sun:#F1EBD0; --soft:#A7A2B5; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#1F2233; --ink:#E6E1D6; --sand:#3A3550; --mummy:#D2A56E; --marker:#E39A5C;
  --cactus:#6FA45C; --eye:#E6E64A; --mouth:#D0596A; --sun:#F1EBD0; --soft:#A7A2B5; color-scheme:dark }
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;gap:8px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;overflow:hidden;-webkit-user-select:none;user-select:none}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:900px;width:100%;margin:0 auto}
h1{font-family:var(--display);font-weight:400;font-size:1.7rem;margin:0;line-height:1.1}
.scores{font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums;display:flex;gap:16px}
.scores span span{color:var(--soft)}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;max-width:900px;width:100%;margin:0 auto;touch-action:none;cursor:pointer}
canvas{display:block;background:#FDFCF8;background:#FDFCF8;background:#FDFCF8;background:#FDFCF8;background:#FDFCF8;background:#FDFCF8;background:#FDFCF8;background:#FDFCF8;border:2px solid var(--ink);border-radius:6px 10px 5px 9px}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;pointer-events:none;padding:16px}
#overlay h2{font-family:var(--display);font-weight:400;font-size:2rem;margin:0;text-wrap:balance}
#overlay p{margin:0;font-size:1rem;max-width:30ch}
#go{pointer-events:auto;font-family:var(--display);font-size:1.4rem;background:var(--sun);color:#3A3520;border:2px solid var(--ink);
  border-radius:12px 8px 14px 9px;padding:6px 26px;cursor:pointer}
#go:focus-visible{outline:3px solid var(--marker);outline-offset:3px}
footer{font-size:.85rem;color:var(--soft);text-align:center}
</style>
</head>

<header>

</header>

    <button id="go" type="button">Jouer</button>
  </div>
</div>
<footer>Décor, momie, oiseau et sarcophage : le dessin original</footer>

function resize(){
  var w=stage.clientWidth,h=stage.clientHeight;
  if(!w||!h)return;
  var cw=Math.min(w-4,(h-4)*VW/VH),ch=cw*VH/VW;
  var dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=cw+'px';cv.style.height=ch+'px';
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  scale=cv.height/VH;
  draw();
}

var best=0;try{best=parseInt(localStorage.getItem('momie-best')||'0',10)||0;}catch(e){}
bestEl.textContent=best;

var state='ready',t=0,dist=0,speed=230,y=0,vy=0,onGround=true,cacti=[],nextGap=300,overAt=0,holding=false;

function reset(){t=0;dist=0;speed=230;y=0;vy=0;onGround=true;cacti=[];nextGap=380;}
function start(){
  if(state==='play')return;
  if(state==='over'&&performance.now()-overAt<500)return;
  reset();state='play';overlay.hidden=true;
}
function jump(){if(onGround){vy=-650;onGround=false;}}
function press(){holding=true;if(state!=='play')start();else jump();}
function release(){holding=false;if(vy<-260)vy=-260;}
stage.addEventListener('pointerdown',function(e){e.preventDefault();press();});
window.addEventListener('pointerup',release);
window.addEventListener('pointercancel',release);
go.addEventListener('click',function(){start();});
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(!e.repeat)press();}
});
window.addEventListener('keyup',function(e){if(e.code==='Space'||e.code==='ArrowUp')release();});

function spawn(){
  var r=Math.random(),c;
  var h=r<0.4?48:(r<0.75?58:68);c={h:h,w:h*SR};
  c.x=VW+20;cacti.push(c);
  nextGap=speed*(0.85+Math.random()*0.9);
}
function gameOver(){
  state='over';overAt=performance.now();
  var s=Math.floor(dist/10);
  if(s>best){best=s;bestEl.textContent=best;try{localStorage.setItem('momie-best',String(best));}catch(e){}
    msg.textContent='Nouveau record : '+s+' !';}
  else msg.textContent='Aïe, un sarcophage !';
  sub.textContent='La momie a parcouru '+s+' mètres.';
  go.textContent='Rejouer';overlay.hidden=false;
}
function update(dt){
  t+=dt;
  if(state!=='play')return;
  speed=Math.min(520,230+dist*0.012);
  var dx=speed*dt;dist+=dx;
  vy+=1850*dt;y+=vy*dt;
  if(y>=0){y=0;vy=0;onGround=true;if(holding)jump();}
  nextGap-=dx;if(nextGap<=0)spawn();
  for(var i=cacti.length-1;i>=0;i--){
    var c=cacti[i];c.x-=dx;
    if(c.x+c.w<-20){cacti.splice(i,1);continue;}
    if(MX+13>c.x+c.w*0.18&&MX-13<c.x+c.w*0.82&&GY+y>GY-c.h*0.9){gameOver();return;}
  }
  scoreEl.textContent=Math.floor(dist/10);
}

function pencil(w){ctx.strokeStyle=INK;ctx.lineWidth=w||2;ctx.lineCap='round';ctx.lineJoin='round';}
function sketch(){ctx.stroke();ctx.save();ctx.globalAlpha=0.45;ctx.translate(0.9,0.7);ctx.stroke();ctx.restore();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawBackground(){
  ctx.fillStyle=SHEET;ctx.fillRect(0,0,VW,VH);
  if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,VW,GY);
  ctx.fillStyle=GROUND;ctx.fillRect(0,GY,VW,VH-GY);
  pencil(2.2);ctx.beginPath();
  var g=dist%40;
  for(var gx=-g;gx<=VW+40;gx+=20){var gyy=GY+Math.sin((gx+dist)*0.05)*1.6;if(gx===-g)ctx.moveTo(gx,gyy);else ctx.lineTo(gx,gyy);}
  sketch();
  pencil(1.5);var p=dist%90;
  for(var px=-p;px<VW+90;px+=90){ctx.beginPath();ctx.moveTo(px+20,GY+20);ctx.lineTo(px+32,GY+20);ctx.moveTo(px+60,GY+42);ctx.lineTo(px+68,GY+42);ctx.stroke();}
}
function drawCactus(c){
  if(sarc.complete&&sarc.naturalWidth)ctx.drawImage(sarc,c.x,GY+3-c.h,c.w,c.h);
}
function drawArm(sx,sy,a){
  ctx.save();ctx.translate(sx,sy);ctx.rotate(a);ctx.drawImage(arm,-6,-30);ctx.restore();
}
function drawMummy(){
  if(!(body.complete&&body.naturalWidth&&arm.complete&&arm.naturalWidth))return;
  var running=state==='play'&&onGround,ph=t*speed*0.05;
  var rock=running?Math.sin(ph)*0.07:0,bob=running?Math.abs(Math.sin(ph))*-3:0;
  var a1=!onGround?-0.22:Math.sin(t*7)*0.07,a2=!onGround?-0.3:Math.sin(t*7+1.6)*0.07;
  ctx.save();ctx.translate(MX,GY+y+bob+2);
  ctx.rotate(state==='over'?-0.3:rock+(onGround?0:-0.08));
  ctx.scale(K,K);ctx.translate(-80,-284);
  drawArm(120,100,a2);
  ctx.drawImage(body,0,0);
  drawArm(131,136,a1);
  ctx.restore();
}
function drawVulture(){
  if(!(vb.complete&&vb.naturalWidth&&vwl.complete&&vwl.naturalWidth&&vwr.complete&&vwr.naturalWidth))return;
  var span=VW+170,x=VW+40-((t*55+span*0.55)%span),yy=78+Math.sin(t*1.7)*14,f=Math.sin(t*9)*0.3;
  ctx.save();ctx.translate(x,yy);ctx.rotate(Math.sin(t*1.7+1.2)*0.06);ctx.scale(K,K);
  ctx.save();ctx.translate(208,112);ctx.rotate(f);ctx.drawImage(vwr,0,-54);ctx.restore();
  ctx.drawImage(vb,0,0);
  ctx.save();ctx.translate(100,140);ctx.rotate(-f);ctx.drawImage(vwl,-90,-45);ctx.restore();
  ctx.restore();
}
function draw(){
  ctx.setTransform(scale,0,0,scale,0,0);
  drawBackground();
  drawVulture();
  for(var i=0;i<cacti.length;i++)drawCactus(cacti[i]);
  drawMummy();
}
